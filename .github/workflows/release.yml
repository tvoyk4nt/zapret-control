name: Build and Release Zapret Control

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Zapret Control ${{ github.ref_name }}"
          releaseBody: |
            Релиз Zapret Control для Windows 10/11 x64.

            Вложения:
            - Установщик NSIS (.exe)
            - Установщик MSI (.msi)

            Обновление приложения выполняется вручную через страницу релизов.
          releaseDraft: true
          args: --bundles nsis,msi
