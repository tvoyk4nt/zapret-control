
name: Build and Release Zapret Control

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check signing secrets
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) {
            Write-Error "TAURI_SIGNING_PRIVATE_KEY is missing"
          } else {
            Write-Host "Private key is available"
          }

          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PASSWORD)) {
            Write-Error "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty"
          } else {
            Write-Host "Password is available"
          }

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Zapret Control ${{ github.ref_name }}"
          releaseBody: |
            Релиз Zapret Control для Windows 10/11 x64.

            Установщик приложения и подписанные файлы обновления.
          releaseDraft: true
          args: --bundles nsis
          uploadUpdaterJson: true
